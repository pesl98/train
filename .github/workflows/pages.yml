name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build notebooks (JupyterLite)
        run: |
          python -m venv jl
          jl/bin/pip install -q jupyterlite-core==0.8.7 jupyterlite-pyodide-kernel==0.8.7 jupyter-server nbformat sympy numpy matplotlib ipywidgets==8.1.9 nbclient ipykernel
          JL=jl/bin sh learn/tools/build.sh
      - name: Test notebooks (every answer key, hint and experiment is executed)
        run: jl/bin/python learn/tools/test_notebooks.py
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icons shared voltaic robotics physics _site/
          mkdir -p _site/learn
          cp -r learn/curriculum.js learn/notebooks _site/learn/
      - name: Password gate
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python3 learn/tools/make_gate.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
