<!doctype html>
<html lang="en">
<head>
<script src="../shared/gate.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Physics Lab</title>
<style>
:root{--bg:#080b17;--panel:rgba(18,23,44,.85);--stroke:rgba(255,255,255,.08);--stroke2:rgba(255,255,255,.18);--text:#e8ebff;--muted:#8a93b8;--accent:#7c8cff;--accent2:#22d3ee;--good:#4ade80;--warn:#fbbf24;--bad:#f87171;--mono:ui-monospace,"Cascadia Code",Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.4 Inter,"Segoe UI",system-ui,sans-serif;overflow:hidden}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#app{display:grid;height:100%;grid-template-rows:52px 1fr;grid-template-columns:1fr 330px}
header{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 14px;background:linear-gradient(180deg,#11172e,#0c1124);border-bottom:1px solid var(--stroke);overflow-x:auto}
.home{color:var(--muted);text-decoration:none;font-size:18px;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--stroke)}
.home:hover{color:var(--text);background:rgba(255,255,255,.08)}
.brand{font-size:16px;font-weight:700;background:linear-gradient(90deg,#22d3ee,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:4px;white-space:nowrap}
.btn,select{font:inherit;color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--stroke);border-radius:9px;height:32px;padding:0 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.1);border-color:var(--stroke2)}
.btn.primary{background:linear-gradient(135deg,#4f46e5,#0ea5e9);border-color:transparent;font-weight:600;min-width:84px}
.btn.on{background:rgba(124,140,255,.28);border-color:var(--accent)}
select option{background:#151a33}
.seg{display:flex}.seg .btn{border-radius:0;margin-left:-1px}.seg .btn:first-child{border-radius:9px 0 0 9px;margin:0}.seg .btn:last-child{border-radius:0 9px 9px 0}
.sp{flex:1}
.pill{padding:3px 10px;border-radius:999px;font-size:12px;border:1px solid var(--stroke2);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--good);border-color:rgba(74,222,128,.4)}.pill.warn{color:var(--warn);border-color:rgba(251,191,36,.45)}.pill.bad{color:var(--bad);border-color:rgba(248,113,113,.5)}
#main{display:grid;grid-template-rows:1fr 250px;min-height:0;min-width:0}
#view,#plots{width:100%;height:100%;display:block}
#vwrap{position:relative;min-height:0}
#plots{border-top:1px solid var(--stroke);background:#0a0e1d}
#hud{position:absolute;left:14px;top:12px;color:var(--muted);font-size:12px;line-height:1.7;pointer-events:none}
#hud b{color:var(--text);font-weight:600}
#side{overflow-y:auto;border-left:1px solid var(--stroke);background:var(--panel);padding:10px 14px 30px}
#side h4{margin:16px 0 6px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.row{display:grid;grid-template-columns:92px 1fr 62px;align-items:center;gap:8px;margin:3px 0}
.row label{color:var(--muted);font-size:12px}
.row input[type=range]{width:100%;accent-color:#7c8cff}
.row output{font-family:var(--mono);font-size:11.5px;text-align:right;color:var(--accent2)}
.chk{display:flex;align-items:center;gap:8px;margin:5px 0;color:var(--text)}
#modal{position:fixed;inset:0;background:rgba(4,6,14,.7);display:none;place-items:center;z-index:10}
#modal.show{display:grid}
.card{width:min(760px,92vw);max-height:86vh;overflow:auto;background:#10152b;border:1px solid var(--stroke2);border-radius:14px;padding:20px 26px}
.card h2{margin:0 0 4px}.card h5{margin:18px 0 4px;font-size:13px;color:var(--accent2)}
.card pre{margin:4px 0;padding:10px 12px;background:#0a0e1d;border:1px solid var(--stroke);border-radius:8px;font:12.5px/1.55 var(--mono);color:#cfd6ff;white-space:pre-wrap}
.card p{margin:4px 0;color:#b6bdde}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a2040;border:1px solid var(--stroke2);padding:8px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media (max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:52px 1fr 300px}#side{grid-column:1;border-left:0;border-top:1px solid var(--stroke)}}
</style>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#080b17">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<script src="../shared/pwa.js"></script>
</head>
<body>
<div id="app">
  <header>
    <a class="home" href="../index.html" title="All laboratories">⌂</a>
    <span class="brand">Physics Lab</span>
    <select id="exp" title="Choose an experiment"></select>
    <button id="bRun" class="btn primary">Pause</button>
    <button id="bReset" class="btn">Reset</button>
    <select id="speed" title="Simulation speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
    <select id="scen" title="Experiment scenarios"></select>
        <span id="status" class="pill">…</span>
    <div class="sp"></div>
    <button id="bTheory" class="btn">Theory</button>
    <button id="bSave" class="btn">Save</button>
    <button id="bLoad" class="btn">Load</button>
    <button id="bCsv" class="btn">CSV</button>
  </header>
  <div id="main">
    <div id="vwrap"><canvas id="view"></canvas><div id="hud" class="mono"></div></div>
    <canvas id="plots"></canvas>
  </div>
  <aside id="side"></aside>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept=".json" hidden>
<script src="../shared/theory.js"></script>
<script src="app.js"></script>
</body>
</html>
